version: '3.8'

services:
  # NOTE: This configuration uses your existing Netbox instance at port 8000
  # as the production source. Only the anonymized instance is created here.

  # Anonymized Netbox Database
  netbox-anon-db:
    image: postgres:15-alpine
    container_name: netbox-anon-db
    environment:
      POSTGRES_DB: netbox_anonymized
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
    volumes:
      - netbox-anon-db-data:/var/lib/postgresql/data
    networks:
      - anon-network
    ports:
      - "5433:5432"  # Different port to avoid conflict
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox -d netbox_anonymized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Anonymized Redis
  netbox-anon-redis:
    image: redis:7-alpine
    container_name: netbox-anon-redis
    networks:
      - anon-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Anonymized Netbox
  netbox-anon:
    image: netboxcommunity/netbox:v4.3-3.3.0
    container_name: netbox-anon
    depends_on:
      netbox-anon-db:
        condition: service_healthy
      netbox-anon-redis:
        condition: service_healthy
    environment:
      DB_HOST: netbox-anon-db
      DB_NAME: netbox_anonymized
      DB_USER: netbox
      DB_PASSWORD: netbox
      REDIS_HOST: netbox-anon-redis
      SECRET_KEY: 'abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-='
      API_TOKEN_PEPPERS: 'default-pepper-0123456789abcdef'
      ALLOWED_HOSTS: '*'
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: admin
    volumes:
      - netbox-anon-media:/opt/netbox/netbox/media
      - netbox-anon-reports:/opt/netbox/netbox/reports
      - netbox-anon-scripts:/opt/netbox/netbox/scripts
    networks:
      - anon-network
    ports:
      - "8001:8080"  # External 8001 -> Internal 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Greenmask - Database Anonymization Tool
  # Connects to your existing Netbox database and creates anonymized copy
  greenmask:
    build: ./greenmask
    container_name: greenmask
    depends_on:
      netbox-anon-db:
        condition: service_healthy
    environment:
      # Source database (your existing production Netbox)
      SOURCE_DB_HOST: netbox-docker-postgres-1
      SOURCE_DB_PORT: 5432
      SOURCE_DB_NAME: netbox
      SOURCE_DB_USER: netbox
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:-J5brHrAXFLQSif0K}
      # Target database (anonymized)
      TARGET_DB_HOST: netbox-anon-db
      TARGET_DB_PORT: 5432
      TARGET_DB_NAME: netbox_anonymized
      TARGET_DB_USER: netbox
      TARGET_DB_PASSWORD: netbox
      # Anonymization settings
      ANONYMIZATION_SEED: ${ANONYMIZATION_SEED:-default-seed-change-me}
    volumes:
      - greenmask-mappings:/mappings
    networks:
      - netbox-docker_default  # Connect to existing Netbox network
      - anon-network            # Connect to anonymized instance
    # Greenmask runs on-demand, not continuously
    profiles:
      - tools

networks:
  # Reference to your existing Netbox Docker network
  netbox-docker_default:
    external: true
    name: netbox-docker_default

  # New network for anonymized instance
  anon-network:
    driver: bridge
    name: netbox-anon-network

volumes:
  # Volumes for anonymized Netbox instance
  netbox-anon-db-data:
  netbox-anon-media:
  netbox-anon-reports:
  netbox-anon-scripts:
  # Greenmask mappings storage
  greenmask-mappings: